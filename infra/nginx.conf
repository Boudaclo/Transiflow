# Les en-têtes de sécurité sont répétés dans chaque bloc : nginx n'hérite pas des add_header d'un niveau supérieur
# dès qu'un bloc en définit un lui-même.
server {
  listen 80;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }

  # Fichiers à nom unique (hash) : cache long.
  location /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }

  # Le service worker et le manifeste ne doivent jamais rester en cache : sinon une mise à jour n'atteint pas les postes.
  location ~ ^/(sw\.js|manifest\.webmanifest)$ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Caméra autorisée pour ce site seulement (scan des tickets) ; rien d'autre.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  }
}
